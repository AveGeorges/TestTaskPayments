name: CD Manual

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      version:
        description: 'Version/tag to deploy (optional)'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.12'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.version || 'main' }}
    
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
    
    - name: Deploy to ${{ github.event.inputs.environment }}
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -e
          
          ENV="${{ github.event.inputs.environment }}"
          VERSION="${{ github.event.inputs.version || 'main' }}"
          
          echo "Deploying to $ENV environment, version: $VERSION"
          
          # Переход в директорию проекта
          cd /opt/payout/app
          
          # Сохранение текущего состояния
          git stash || true
          
          # Получение указанной версии
          if [ "$VERSION" != "main" ]; then
            git fetch origin tag $VERSION
            git checkout $VERSION
          else
            git fetch origin
            git reset --hard origin/main
          fi
          
          # Применение миграций
          echo "Running migrations..."
          docker-compose exec -T web python manage.py migrate --noinput
          
          # Сбор статических файлов
          echo "Collecting static files..."
          docker-compose exec -T web python manage.py collectstatic --noinput
          
          # Пересборка и перезапуск контейнеров
          echo "Rebuilding and restarting containers..."
          docker-compose up -d --build
          
          # Проверка статуса контейнеров
          echo "Checking container status..."
          docker-compose ps
          
          echo "Deployment to $ENV completed successfully"
        EOF
    
    - name: Health check
      run: |
        sleep 10
        curl -f https://${{ secrets.SERVER_HOST }}/api/v1/health/ || exit 1
    
    - name: Notify deployment
      if: always()
      run: |
        STATUS="${{ job.status }}"
        ENV="${{ github.event.inputs.environment }}"
        echo "Deployment to $ENV: $STATUS"
        # Здесь можно добавить уведомления (Slack, Telegram, Email)
